name: Refresh IPTV playlists

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update checkout
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh source playlist and verified Roya URL
        run: |
          python build_playlist.py \
            --arab-output /tmp/arab-countries-candidates.m3u \
            --refresh-working-playlist arab-countries.m3u

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.country.m3u arab-countries.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh IPTV playlists"
            git push
          fi
