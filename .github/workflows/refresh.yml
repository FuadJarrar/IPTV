name: Refresh direct Roya in arab-list

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - roya.py
      - build_playlist.py
      - test_channels.py
      - tests/**
      - .github/workflows/refresh.yml
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: iptv-repository-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update checkout
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify playlist safeguards
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Ensure playback tools are installed
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Test and refresh direct Roya URL in existing playlists
        run: |
          python build_playlist.py --refresh-roya-only \
            --refresh-working-playlist arab-countries.m3u

      - name: Verify no placeholder hosts or hosted Roya link
        run: |
          if grep -Eiq 'example\.invalid|roya-tv-on-demand\.' arab-countries.m3u; then
            echo "Invalid or obsolete Roya source found in arab-list"
            exit 1
          fi

      - name: Commit updated playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.country.m3u arab-countries.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh verified direct Roya stream"
            git push
          fi
